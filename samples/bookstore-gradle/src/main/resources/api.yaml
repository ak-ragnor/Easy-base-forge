openapi: 3.0.3
info:
  title: Bookstore API
  version: 1.0.0
  description: >
    Complete bookstore demo for EasyBase Forge.
    Covers authors, books and reviews with paginated listing,
    MULTI_MODULE layout, tenant support, VOID_ONLY wrapping,
    and Spring Data pagination.

tags:
  - name: authors
    description: Author management
  - name: books
    description: Book catalogue management
  - name: reviews
    description: Book review management

paths:

  /authors:
    get:
      tags: [authors]
      operationId: listAuthors
      summary: Paginated list of authors
      x-easybase-paginated: true
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorDTO'

    post:
      tags: [authors]
      operationId: createAuthor
      summary: Create a new author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDTO'

  /authors/{id}:
    get:
      tags: [authors]
      operationId: getAuthorById
      summary: Get an author by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDTO'
        '404':
          description: Not found

    put:
      tags: [authors]
      operationId: updateAuthor
      summary: Update an author
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDTO'

    delete:
      tags: [authors]
      operationId: deleteAuthor
      summary: Delete an author (soft)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /books:
    get:
      tags: [books]
      operationId: listBooks
      summary: Paginated list of books
      x-easybase-paginated: true
      parameters:
        - name: authorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: genre
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookDTO'

    post:
      tags: [books]
      operationId: createBook
      summary: Add a book to the catalogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDTO'

  /books/{id}:
    get:
      tags: [books]
      operationId: getBookById
      summary: Get a book by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDTO'
        '404':
          description: Not found

    put:
      tags: [books]
      operationId: updateBook
      summary: Update a book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDTO'

    delete:
      tags: [books]
      operationId: deleteBook
      summary: Delete a book (soft)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      summary: Paginated list of reviews for a book
      x-easybase-paginated: true
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewDTO'

    post:
      tags: [reviews]
      operationId: createReview
      summary: Post a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'

  /reviews/{id}:
    get:
      tags: [reviews]
      operationId: getReviewById
      summary: Get a review by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'

    delete:
      tags: [reviews]
      operationId: deleteReview
      summary: Delete a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted

components:
  schemas:

    AuthorDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        bio:
          type: string
          nullable: true
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateAuthorRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
        email:
          type: string
          format: email
          maxLength: 255

    UpdateAuthorRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
          maxLength: 1000

    BookDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        isbn:
          type: string
        genre:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        publishedDate:
          type: string
          format: date
          nullable: true
        authorId:
          type: string
          format: uuid
        coverImageId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateBookRequest:
      type: object
      required: [title, isbn, authorId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        isbn:
          type: string
          minLength: 10
          maxLength: 20
        genre:
          type: string
          maxLength: 50
        price:
          type: number
          minimum: 0
        publishedDate:
          type: string
          format: date
        authorId:
          type: string
          format: uuid
        coverImageId:
          type: string
          format: uuid

    UpdateBookRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        genre:
          type: string
          maxLength: 50
        price:
          type: number
          minimum: 0
        coverImageId:
          type: string
          format: uuid

    ReviewDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        reviewerName:
          type: string
        bookId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateReviewRequest:
      type: object
      required: [rating, reviewerName, bookId]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000
        reviewerName:
          type: string
          minLength: 1
          maxLength: 100
        bookId:
          type: string
          format: uuid
