entity: User
basePackage: com.example.app
tablePrefix: eb_
idType: UUID

fields:
  - name: email
    type: String
    required: true
    maxLength: 255
    unique: true
  - name: firstName
    type: String
    maxLength: 100

relationships:
  - type: MANY_TO_ONE
    entity: Tenant
    field: tenant
    column: tenant_id
    nullable: false
    fetch: LAZY
    cascade: []
    foreignKey: fk_eb_users_tenant_id
  - type: ONE_TO_MANY
    entity: Post
    field: posts
    mappedBy: user
    cascade: [ALL]
    fetch: LAZY

audit:
  enabled: true
  softDelete: true
  softDeleteColumn: deleted
  auditorType: UUID

crud:
  create: true
  update: true
  delete: true
  get: true
  list: true

hook:
  enabled: true
  multiple: true
